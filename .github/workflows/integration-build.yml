name: Combined TestDPC and Rethink APK
on:
  push:
    branches: [integration/testdpc-rethink]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combined-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Clone source repositories
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" target
          git clone --depth 1 https://github.com/yechwood/rethink-app.git rethink
          git clone --depth 1 https://github.com/yechwood/android-testdpc.git testdpc
      - name: Integrate TestDPC into Rethink
        run: |
          chmod +x target/scripts/integrate-testdpc-rethink.sh
          target/scripts/integrate-testdpc-rethink.sh
      - name: Build merged APK
        working-directory: rethink
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --info :app:assembleFdroidFullDebug -PfirestackRepo=jitpack
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="$(find rethink/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TAG="combined-debug-${RUN_NUMBER}"
          gh release create "$TAG" "$APK#TestDPC-Rethink-combined-debug.apk" --repo "$GITHUB_REPOSITORY" --title "Combined TestDPC + Rethink debug build ${RUN_NUMBER}" --notes "Automated debug build from integration/testdpc-rethink; validate on-device before production use." --prerelease
