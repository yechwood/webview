name: Combined TestDPC and Rethink APK
on:
  push:
    branches: [integration/testdpc-rethink]
  workflow_dispatch:
concurrency:
  group: combined-testdpc-rethink-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  combined-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Clone source repositories
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" target
          git clone --depth 1 https://github.com/yechwood/rethink-app.git rethink
          git clone --depth 1 https://github.com/yechwood/android-testdpc.git testdpc
      - name: Integrate TestDPC into Rethink
        run: |
          chmod +x target/scripts/integrate-testdpc-rethink.sh
          target/scripts/integrate-testdpc-rethink.sh
      - name: Build merged APK
        working-directory: rethink
        run: |
          chmod +x ./gradlew
          echo "Gradle build started at $(date -u +%FT%TZ)"
          timeout --signal=TERM --kill-after=60s 30m ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 :app:assembleFdroidFullDebug -PfirestackRepo=jitpack
          echo "Gradle build finished at $(date -u +%FT%TZ)"
          find app/build/outputs/apk -maxdepth 4 -type f -name '*.apk' -print
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-fixed-testdpc-rethink-apk
          path: rethink/app/build/outputs/apk/fdroidFull/debug/app-fdroid-full-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish single APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK_DIR="rethink/app/build/outputs/apk/fdroidFull/debug"
          APK="$APK_DIR/app-fdroid-full-armeabi-v7a-debug.apk"
          test -s "$APK"
          TAG="combined-debug-${RUN_NUMBER}"
          gh release create "$TAG" \
            "$APK#TestDPC-Rethink.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Combined TestDPC + Rethink debug build ${RUN_NUMBER}" \
            --notes "Single ARM32 APK built with namespaced TestDPC content-provider authorities. Validate on-device before production use." \
            --prerelease
